# syntax=docker/sandbox-kit:3

schemaVersion: "3"
kind: mixin
displayName: DDGS Mixin for Docker Sandboxes
description: Provides DDGS search MCP for Docker Sandboxes. Utilises the latest v3 kit specification.

args:
  ddgsBranch:
    default: "v9.16.1"
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    description: DDGS release to install
    buildArg: DDGS_BRANCH
  ddgsShellImageTag:
    default: "latest"
    pattern: '.*'
    description: Tag of sbx/shell-image
    buildArg: SHELL_IMAGE_TAG
  ddgsUvTag:
    default: "latest"
    pattern: '.*'
    description: Tag of astral/uv
    buildArg: UV_TAG

dockerfile: ./ddgs-mixin.dockerfile
